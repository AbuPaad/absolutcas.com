<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Absolut CAS</title>
    <meta name="description" content="Absolut CAS — hello, world." />
    <style>
      :root {
        color-scheme: dark;
        --ink: #1a1a1a;
        --paper: #e9e9e3;
        --silver: #c4c4bc;
        --lcd: #9aa88e;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--ink);
        color: var(--paper);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.55;
        -webkit-text-size-adjust: 100%;
      }
      main { max-width: 34rem; text-align: center; }
      h1 {
        margin: 0 0 .75rem;
        font-size: clamp(2rem, 8vw, 3rem);
        font-weight: 600;
        letter-spacing: .01em;
      }
      p { margin: 0; color: var(--silver); }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: .95em;
        color: var(--lcd);
      }
      footer {
        margin-top: 2.25rem;
        font-size: .8rem;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: #7a7a74;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, World!</h1>
      <p>This is <code>absolutcas.com</code> — a static site served from GitHub Pages.</p>
      <footer>Absolut CAS</footer>
    </main>
  </body>
</html>
