<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>404 — Absolut CAS</title>
    <style>
      :root { color-scheme: dark; --ink:#1a1a1a; --paper:#e9e9e3; --silver:#c4c4bc; --lcd:#9aa88e; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; display: grid; place-items: center; padding: 2rem;
        background: var(--ink); color: var(--paper);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.55;
      }
      main { max-width: 32rem; text-align: center; }
      h1 { margin: 0 0 .75rem; font-size: clamp(2rem, 8vw, 3rem); font-weight: 600; }
      p { margin: 0 0 1.5rem; color: var(--silver); }
      a { color: var(--lcd); }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>That page doesn't exist here.</p>
      <p><a href="/">Back to the front page</a></p>
    </main>
  </body>
</html>
